name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # The console reporter drops assertion messages; the XML keeps them.
      - name: Show test failures
        if: failure()
        run: |
          grep -rh -A3 '<failure' app/build/test-results/testDebugUnitTest/*.xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
