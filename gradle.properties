# Every dependency here is AndroidX, so this is not optional: the build fails
# at :app:checkDebugAarMetadata without it. Still required under AGP 9 --
# built-in Kotlin changes how Kotlin is compiled, not which libraries are used. jetifier is NOT enabled -- nothing
# in this project uses a support-library artifact, so running the jetifier
# would only rewrite class files on every build for no benefit.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose is a Kotlin compiler plugin and its bookkeeping grows with the
# module. 2g is the smallest that reliably builds a Compose app in Termux,
# where the whole toolchain is in one process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Keeps the Gradle daemon and the Kotlin daemon warm between runs, which
# matters most on a phone where a cold Kotlin compile is the slow part.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
